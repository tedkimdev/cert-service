apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-service
  namespace: cert-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cert-service
  template:
    metadata:
      labels:
        app: cert-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: cert-service
          image: cert-service:latest
          # For local development with Minikube:
          # 1. eval $(minikube docker-env)
          # 2. docker build -t cert-service:latest ./backend
          # 3. kubectl apply -f k8s/
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: cert-service-config
            - secretRef:
                name: cert-service-secret
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi