apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs
  namespace: cert-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nextjs
  template:
    metadata:
      labels:
        app: nextjs
    spec:
      containers:
        - name: nextjs
          image: cert-service-frontend:latest
          # For local development with Minikube:
          # 1. eval $(minikube docker-env)
          # 2. docker build -t cert-service-frontend:latest ./frontend
          # 3. kubectl apply -f k8s/
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: nextjs-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi